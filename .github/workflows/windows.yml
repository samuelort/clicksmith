name: Windows
on:
  push:
    paths: ['windows/**', '.github/workflows/windows*.yml']
  pull_request:
    paths: ['windows/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Self-test
        run: |
          dotnet build src/Clicksmith.SelfTest/Clicksmith.SelfTest.csproj -c Release -nologo
          dotnet src/Clicksmith.SelfTest/bin/Release/net8.0/Clicksmith.SelfTest.dll
      - name: Build engine, app and DPI probe
        run: |
          foreach ($p in 'Clicksmith.Engine','Clicksmith.App','Clicksmith.DpiProbe') {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 --self-contained false -o build/out -nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Release check (MANIFEST.sha256)
        run: |
          . ./scripts/lib/common.ps1
          Test-ReleaseFiles
      - name: Script syntax
        run: |
          foreach ($f in Get-ChildItem scripts, . -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Clicksmith-Windows-build
          path: windows/build/out
