name: Beta bug report
description: Report a Clicksmith beta problem
title: "[Beta] "
labels: [bug, beta]
body:
  - type: input
    id: version
    attributes: {label: Clicksmith version, placeholder: "1.2.4"}
    validations: {required: true}
  - type: input
    id: mac
    attributes: {label: Mac + macOS, placeholder: "MacBook Pro M3, macOS 15.x"}
    validations: {required: true}
  - type: input
    id: mouse
    attributes: {label: Mouse + connection, placeholder: "SteelSeries Rival 3 Wireless Gen 2, 2.4 GHz"}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: What happened instead}
    validations: {required: true}
  - type: textarea
    id: verify
    attributes: {label: verify.sh output, description: "Paste output from ./scripts/verify.sh 20. Remove anything you don't want to share."}
